<title>トンボ大戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#04060d; --ink:#e6efff; --dim:#8a97bb; --line:rgba(120,200,255,.26);
  --panel:rgba(7,11,26,.8); --cy:#3ff2ff; --mg:#ff4fd8; --am:#ffb53f; --ok:#3fffa8; --bad:#ff4f5e; --gold:#ffc93f;
  --disp:'DotGothic16','Hiragino Sans','Yu Gothic','Microsoft YaHei','Malgun Gothic',monospace;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic','PingFang SC','Microsoft YaHei','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --num:'Chakra Petch','Zen Kaku Gothic New',system-ui,sans-serif;
}
[hidden]{display:none!important}
#menu .col,#shop .col{touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.ov{position:fixed;inset:0}

/* ---------- menu ---------- */
#menu,#shop{display:grid;grid-template-columns:1fr minmax(340px,500px);gap:24px;padding:22px 26px;pointer-events:none;background:linear-gradient(90deg,rgba(4,6,13,0) 40%,rgba(4,6,13,.55))}
#menu>*,#shop>*{pointer-events:auto}
.brand{align-self:start;display:flex;flex-direction:column;gap:6px}
.brand .en{font-family:var(--num);letter-spacing:.45em;color:var(--cy);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{font-family:var(--disp);font-weight:400;font-size:clamp(36px,5.8vw,104px);word-break:keep-all;letter-spacing:.04em;margin:0;line-height:1.05;color:#f4fbff;text-wrap:balance;
  text-shadow:0 0 22px rgba(63,242,255,.75),0 0 60px rgba(255,79,216,.35)}
.brand p{margin:6px 0 0;color:var(--dim);max-width:30em;line-height:1.7}
.col{overflow-y:auto;max-height:calc(100vh - 44px);display:flex;flex-direction:column;gap:12px;padding:2px 6px 2px 2px;scrollbar-width:thin}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px 16px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));backdrop-filter:blur(6px)}
.panel h2{font-family:var(--disp);font-weight:400;font-size:15px;margin:0 0 10px;letter-spacing:.12em;display:flex;justify-content:space-between;align-items:baseline;color:var(--cy)}
.panel h2 small{font-family:var(--num);color:var(--dim);font-size:10px;letter-spacing:.3em}
.lbl{font-size:11px;color:var(--dim);letter-spacing:.12em;margin:10px 0 6px;display:flex;justify-content:space-between}
.lbl:first-of-type{margin-top:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border:2px solid rgba(255,255,255,.1);cursor:pointer;background:var(--c);box-shadow:0 0 10px var(--c);padding:0}
.sw.on{border-color:#fff;transform:scale(1.12)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{background:rgba(255,255,255,.03);border:1px solid var(--line);padding:8px 6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button b{font-family:var(--disp);font-weight:400;font-size:14px}
.seg button span{font-size:10px;color:var(--dim);line-height:1.4}
.seg button.on{border-color:var(--cy);background:rgba(63,242,255,.1);box-shadow:inset 0 0 14px rgba(63,242,255,.22)}
.seg.small button{align-items:center;text-align:center;padding:6px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.langbar{display:flex;align-items:center;gap:10px}
.langbar .lbl{margin:0;white-space:nowrap}
.langbar .seg{flex:1}
input[type=range]{width:100%;accent-color:var(--cy)}
.bias{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);letter-spacing:.1em}
input[type=text]{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);padding:7px 9px;font:inherit;font-size:14px}
.stats{display:grid;grid-template-columns:4.6em 1fr 3em;gap:6px 10px;align-items:center;margin-top:12px}
.stats span{font-size:11px;color:var(--dim);letter-spacing:.1em}
.stats i{display:block;height:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 10px,transparent 10px 12px);position:relative}
.stats i::after{content:"";position:absolute;inset:0;width:var(--w);background:repeating-linear-gradient(90deg,var(--c) 0 10px,transparent 10px 12px);box-shadow:0 0 8px var(--c);transition:width .25s}
.stats em{font-style:normal;font-family:var(--num);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stage{aspect-ratio:4/3;max-width:100%;position:relative;border:1px solid var(--line);background:var(--g);cursor:pointer;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;gap:2px;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent 75%)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:40%;height:26%;background:repeating-linear-gradient(90deg,var(--k) 0 7px,transparent 7px 10px);opacity:.5;clip-path:polygon(0 60%,8% 60%,8% 20%,20% 20%,20% 50%,34% 50%,34% 0,44% 0,44% 40%,60% 40%,60% 15%,72% 15%,72% 55%,86% 55%,86% 30%,100% 30%,100% 100%,0 100%)}
.stage b,.stage span{position:relative;z-index:1}
.stage .rq{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-family:var(--disp);font-size:44px;color:#fff;text-shadow:0 0 14px rgba(0,0,0,.6);z-index:1;padding-bottom:46px}
.stage b{font-family:var(--disp);font-weight:400;font-size:15px}
.stage span{font-size:10px;color:#cfd8f0;line-height:1.35}
.stage.on{outline:2px solid var(--cy);outline-offset:1px;box-shadow:0 0 18px rgba(63,242,255,.35)}
.start{font-family:var(--disp);font-size:26px;letter-spacing:.4em;padding:14px 0 14px .4em;background:linear-gradient(90deg,var(--cy),var(--mg));color:#04060d;border:0;cursor:pointer;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:0 0 30px rgba(63,242,255,.4)}
.start:hover{filter:brightness(1.15)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;align-items:center}
kbd{font-family:var(--num);font-size:11px;border:1px solid var(--line);padding:1px 6px;background:rgba(255,255,255,.05);white-space:nowrap}
.note{font-size:11px;color:var(--dim);line-height:1.6;margin:8px 0 0}
.row3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}

/* ---------- HUD ---------- */
#hud{pointer-events:none;font-family:var(--num)}
.tl{position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:3px;min-width:180px}
.sb{display:grid;grid-template-columns:10px 1fr 18px auto auto;gap:8px;align-items:center;font-size:13px;padding:3px 8px;background:rgba(4,8,20,.55);border-left:2px solid transparent}
.sb.me{border-left-color:var(--cy);background:rgba(63,242,255,.12)}
.sb i{width:10px;height:10px;background:var(--c);box-shadow:0 0 8px var(--c)}
.sb span{font-family:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.cr{width:16px;height:12px;filter:drop-shadow(0 0 4px var(--gold))}
.tc{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center}
#timer{font-size:30px;font-weight:700;letter-spacing:.08em;text-shadow:0 0 12px rgba(63,242,255,.6);font-variant-numeric:tabular-nums}
#stageName{font-family:var(--disp);font-size:12px;color:var(--dim);letter-spacing:.3em}
.tr{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{width:170px;height:170px;border-radius:50%;border:1px solid var(--line);background:rgba(4,8,20,.6);box-shadow:0 0 20px rgba(63,242,255,.15)}
#feed{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#feed div.mine{background:rgba(255,181,63,.28);border-left:3px solid var(--am);font-size:14px}
#feed div.meDown{background:rgba(255,79,94,.28);border-left:3px solid var(--bad);font-size:14px}
#feed .w{color:#cfd6ea;font-size:11px;margin:0 6px;opacity:.85}
#koBan{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;z-index:3}
#koBan.show{opacity:1;animation:kob .32s cubic-bezier(.2,1.6,.4,1)}
#koBan .k1{display:block;font-family:var(--disp);font-size:clamp(22px,3.6vw,38px);letter-spacing:.08em;color:#fff;text-shadow:0 0 16px var(--c),0 0 4px var(--c)}
#koBan .k1 b{color:var(--c)}
#koBan .k2{display:inline-block;margin-top:6px;font-family:var(--body);font-size:14px;color:#fff;background:rgba(4,8,20,.65);padding:3px 12px;border:1px solid var(--am)}
@keyframes kob{from{transform:translate(-50%,-50%) scale(1.7)}}
#deadBy{font-size:22px!important;border:1px solid var(--bad)}#deadBy b{color:var(--c)}
.mk.ally .n::before{content:attr(data-a);font-size:9px;border:1px solid var(--c);padding:0 3px;margin-right:4px}.mk.enemy .n{color:#ffd0d4}
.tres{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:18px;font-family:var(--disp);font-size:20px;padding:6px 0 10px}.tres b{color:var(--c);text-shadow:0 0 10px var(--c)}.tres span{font-size:13px;color:var(--dim)}
.tsc{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--num);font-size:20px;padding:3px 10px;background:rgba(4,8,20,.6);margin-bottom:2px}.tsc b{color:var(--c);text-shadow:0 0 8px var(--c)}.tsc span{font-family:var(--body);font-size:10px;color:var(--dim)}
.sb.down{opacity:.7}.sb.down i{opacity:.35}.sb .x{color:var(--bad);font-weight:900;margin-right:5px;text-shadow:0 0 6px var(--bad)}.sb .rs{font-size:10px;color:var(--am);border:1px solid var(--am);padding:0 4px;margin-left:4px;white-space:nowrap}
.fl.killer{font-size:13px;border-width:2px;background:rgba(40,4,10,.75);transform:translate(-50%,-100%);box-shadow:0 0 12px var(--bad)}
.fl.spawn{font-size:11px;opacity:.85;border-style:dashed}
#feed div{font-family:var(--body);font-size:12px;background:rgba(4,8,20,.6);padding:3px 8px;animation:fin .25s}
#feed b{font-weight:700}
#feed .amb{color:var(--am);font-size:10px;border:1px solid var(--am);padding:0 4px;margin-left:4px}
@keyframes fin{from{transform:translateX(20px);opacity:0}}
.bl{position:absolute;left:16px;bottom:16px;width:min(320px,44vw);display:flex;flex-direction:column;gap:6px}
#log{display:flex;flex-direction:column;gap:2px}
#log div{font-family:var(--body);font-size:12px;padding:2px 8px;background:rgba(4,8,20,.62);border-left:3px solid var(--c);animation:fin .2s;display:flex;gap:8px;align-items:baseline}
#log b{font-family:var(--num);font-size:16px;color:var(--c);font-variant-numeric:tabular-nums;min-width:2.6em}
.hpline{display:flex;align-items:baseline;gap:6px}
.hpbig{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--hc,var(--ok));text-shadow:0 0 12px var(--hc,var(--ok))}
.hpbig.bump{animation:bump .3s}
@keyframes bump{0%{transform:scale(1.25);color:#fff}}
.hpmax{font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.hpline .lab{margin-left:auto;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.bar{height:12px;background:rgba(255,255,255,.07);position:relative;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.bar i{position:absolute;inset:0;width:var(--w,100%);background:var(--c);box-shadow:0 0 10px var(--c);transition:width .12s}
.bar.hp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(4,6,13,.8) calc(10% - 2px) 10%)}
.bar.en{height:7px}
.bar.en.full i{animation:enP .5s ease-in-out infinite alternate}
@keyframes enP{to{filter:brightness(1.8);box-shadow:0 0 18px #7affd0}}
#enTxt.full{color:#7affd0}
.blt{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.blt b{color:var(--ink);font-variant-numeric:tabular-nums}
#fx{display:flex;gap:6px;flex-wrap:wrap}
#fx span{font-family:var(--body);font-size:11px;padding:1px 6px;border:1px solid var(--c);color:var(--c);letter-spacing:.08em}
.rbox{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;align-items:baseline;gap:10px;padding:5px 14px;border:1px solid var(--rc,#ffe06a);background:rgba(20,14,4,.7);box-shadow:0 0 18px var(--rc,#ffe06a),inset 0 0 12px rgba(255,224,106,.25);white-space:nowrap;animation:fb .8s ease-in-out infinite alternate}
.rbox b{font-family:var(--disp);font-weight:400;font-size:16px;color:var(--rc,#ffe06a);letter-spacing:.08em}
.rbox span{font-size:12px;color:#fff}
body.touch .rbox{bottom:12px;left:40%}
.fl.relic .ra{display:none;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid var(--c);margin-right:7px;vertical-align:middle;filter:drop-shadow(0 0 4px var(--c))}.fl.relic.edge .ra{display:inline-block}.fl.relic .rd{margin-left:8px;font-size:12px;color:#fff;font-family:var(--body)}.fl.relic.edge{animation:rpulse .8s ease-in-out infinite alternate}@keyframes rpulse{to{box-shadow:0 0 26px var(--c)}}
.fl.relic.hold{font-size:13px;padding:2px 9px;transform:translate(-50%,-100%)}.fl.relic.hold .who{color:#fff;margin-right:6px}

.bc{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(4,8,20,.6);border:1px solid var(--line);padding:8px 14px 8px 8px;min-width:220px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
#itemIcon{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);color:var(--c,var(--dim))}

#cross::after{top:0;left:12px;width:2px;height:26px;background:linear-gradient(180deg,var(--cc) 0 9px,transparent 9px 17px,var(--cc) 17px)}
#cross.hit{--cc:var(--am)}
#markers{position:absolute;inset:0;overflow:hidden}
.mk{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--body);font-size:11px;white-space:nowrap;text-shadow:0 0 4px #000}

.it.none::after{content:'';width:5px;height:5px;background:rgba(255,255,255,.18)}
.it b{font-family:var(--num);font-size:9px;margin-left:-3px;align-self:end;color:#fff}
.mk .hn{font-family:var(--num);font-size:13px;font-weight:700;font-style:normal;color:var(--c)}
.mk .hp{width:44px;height:4px;background:rgba(255,255,255,.15)}
.mk .hp i{display:block;height:100%;background:var(--c)}
.mk .br{width:18px;height:18px;border:2px solid var(--c);margin-top:2px;box-shadow:0 0 8px var(--c)}
.mk .d{font-family:var(--num);font-size:10px;color:var(--dim)}
.eg{height:3px;background:rgba(122,255,208,.15);position:relative;overflow:hidden}
.eg i{position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:#7affd0;box-shadow:0 0 6px #7affd0}
.eg.full i{animation:enP .5s ease-in-out infinite alternate;background:#dfffF4}
.mk .eg{width:44px;margin-top:1px}
.sb .eg{grid-column:2/-1;margin-top:-3px}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--body);font-size:12px;padding:2px 8px;border:1px solid var(--c);color:var(--c);background:rgba(4,8,20,.55);white-space:nowrap}
.dmg{position:absolute;font-family:var(--num);font-weight:700;font-size:28px;color:var(--am);text-shadow:0 0 10px rgba(255,181,63,.9),0 2px 0 #000;transform:translate(-50%,-50%)}
.dmg.big{font-size:36px;color:#fff;text-shadow:0 0 14px var(--am),0 2px 0 #000}
.taken{position:absolute;left:50%;top:62%;font-family:var(--num);font-weight:700;font-size:46px;color:var(--bad);text-shadow:0 0 14px rgba(255,79,94,.9),0 2px 0 #000;animation:tk 1.1s ease-out forwards;white-space:nowrap}
.taken small{display:block;font-family:var(--body);font-size:13px;font-weight:700;text-align:center;color:#ffd0d6}
@keyframes tk{0%{transform:translate(-50%,-50%) scale(1.5);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
#sndHint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;pointer-events:none;font-family:var(--body);font-size:13px;color:#fff;background:rgba(7,11,26,.85);border:1px solid var(--cy);padding:6px 14px;box-shadow:0 0 12px rgba(63,242,255,.4);animation:sndp 1.6s ease-in-out infinite alternate}@keyframes sndp{to{opacity:.55}}
#rotate{display:none;position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 50% 45%,#0c1433,#04060d 70%);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:#fff}
#rotate .ph{width:54px;height:92px;border:3px solid var(--cy);border-radius:10px;box-shadow:0 0 18px var(--cy);animation:rotph 2.2s ease-in-out infinite}

@media (orientation:portrait){body.touch #rotate{display:flex}}
#toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-family:var(--disp);font-size:28px;letter-spacing:.15em;text-align:center;text-shadow:0 0 16px var(--c,var(--cy));color:#fff;opacity:0;transition:opacity .2s}

#warn b{font-family:var(--num);margin-left:10px}

@keyframes lk{to{transform:rotate(90deg)}}
#impact{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95),rgba(255,240,200,.55) 35%,rgba(255,120,60,.18) 70%,transparent);mix-blend-mode:screen}

/* ---------- pause / result ---------- */
.modal{display:grid;place-items:center;background:rgba(2,4,10,.72);backdrop-filter:blur(4px);padding:16px}
.card{width:min(540px,100%);display:flex;flex-direction:column;gap:14px}

.banner{padding:12px;border:1px solid rgba(255,201,63,.4);background:radial-gradient(120% 90% at 50% 0%,rgba(255,201,63,.22),rgba(255,79,216,.08) 60%,transparent)}

@keyframes pcIn{0%{opacity:0;transform:rotateY(90deg) scale(.8)}100%{opacity:1;transform:none}}
#pullTitle{color:var(--rc,#fff);text-shadow:0 0 18px var(--rc,var(--cy))}
.bw{margin:0;text-align:center;font-family:var(--num);font-size:20px;color:var(--gold)}

.reward{display:flex;flex-direction:column;gap:4px;border:1px solid rgba(255,201,63,.35);padding:10px 12px;background:rgba(255,201,63,.06)}

.btns.three{grid-template-columns:1fr 1fr 1fr}
@media (prefers-reduced-motion:reduce){.pc{animation:none;opacity:1}#count{animation:none}}
/* keep short UI strings on a single line */
#toast{white-space:nowrap;font-size:clamp(16px,2.4vw,28px)}

#warn,#dead p,#lockHint,#feed div,#log div,#fx span,.tabs button,.pullb b,.pullb span,.btn,.seg button b,.lbl,.blt,#itemName,#stageName,.ws b,.shopBtn,.coinbar,.rchip{white-space:nowrap}
.btn{letter-spacing:.12em;overflow:hidden;text-overflow:ellipsis}

.bc>div:last-child{min-width:0}
#itemHint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rank span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

@media (max-width:860px) and (max-height:520px) and (orientation:landscape){
  #menu:not([hidden]),#shop:not([hidden]){display:grid!important}
  #menu,#shop{grid-template-columns:1fr minmax(300px,54%);gap:14px;padding:10px 14px;pointer-events:none!important;overflow:visible!important;background:linear-gradient(90deg,rgba(4,6,13,0) 30%,rgba(4,6,13,.6))!important}

}

  .pgrid{grid-template-columns:repeat(3,1fr)}

  .brand h1{font-size:48px}

}

.onlist{display:flex;flex-direction:column;gap:6px}
.onp{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);background:rgba(255,255,255,.03);white-space:nowrap}
.onp i{width:12px;height:12px;background:var(--c);box-shadow:0 0 8px var(--c)}
.onp span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.onp small{font-family:var(--num);color:var(--dim)}
.onp em{font-style:normal;font-size:11px;padding:0 6px;border:1px solid var(--am);color:var(--am)}
.onp.me{border-color:var(--cy)}
#onStatus{margin:0}
.oncap{font-family:var(--num);font-size:10px;letter-spacing:.2em;padding:0 5px;border:1px solid var(--mg);color:var(--mg);margin-left:6px}
/* ---------- smartphone / touch ---------- */
#touch{position:absolute;inset:0;pointer-events:auto;touch-action:none;-webkit-touch-callout:none}
.tb{position:absolute;display:grid;place-items:center;border-radius:50%;border:2px solid var(--tc);color:var(--tc);background:radial-gradient(circle,rgba(4,8,20,.35),rgba(4,8,20,.7));
  font-family:var(--disp);font-size:14px;letter-spacing:.08em;box-shadow:0 0 16px var(--tc),inset 0 0 14px var(--tc);touch-action:none;-webkit-user-select:none;user-select:none;white-space:nowrap}
.tb.on{background:var(--tc);color:#04060d}
#tDash{--tc:var(--cy);right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:96px;height:96px;font-size:17px}
#tBeam{--tc:#7affd0;right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(172px + env(safe-area-inset-bottom,0px));width:66px;height:66px;font-size:13px;animation:fb .6s ease-in-out infinite alternate}
#tTurn{--tc:var(--am);right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px));width:62px;height:62px;font-size:13px}
#tStop{--tc:var(--mg);right:calc(128px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:70px;height:70px}
#tItem{--tc:var(--c,var(--dim));right:calc(34px + env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));width:70px;height:70px;font-size:12px}
#tItem svg{width:30px;height:30px;filter:drop-shadow(0 0 6px currentColor)}
#tItem.empty{opacity:.45}
#tPause{--tc:rgba(230,240,255,.7);left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:8px;font-family:var(--num);font-size:14px;box-shadow:none}
#tStick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid rgba(63,242,255,.45);border-radius:50%;pointer-events:none;box-shadow:0 0 18px rgba(63,242,255,.25)}
#tStick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(63,242,255,.35);border:2px solid var(--cy);box-shadow:0 0 14px var(--cy)}
#tHint{position:absolute;left:18px;bottom:44%;font-size:12px;color:var(--dim);letter-spacing:.1em;white-space:nowrap;pointer-events:none;animation:fb 1.2s ease-in-out infinite alternate}
#rotHint{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-size:14px;background:rgba(4,8,20,.8);border:1px solid var(--line);padding:8px 14px;white-space:nowrap;pointer-events:none}
body.touch .bc,body.touch #lockHint{display:none!important}
body.touch #mini{width:96px;height:96px}
body.touch .tl{min-width:120px;left:10px;top:8px}
body.touch .sb{font-size:11px;padding:2px 6px}
body.touch .tr{right:10px;top:8px}
body.touch #feed div{font-size:10px}
body.touch .bl{left:10px;bottom:10px;width:min(240px,36vw)}
body.touch .hpbig{font-size:26px}
body.touch #log{display:none}
body.touch #timer{font-size:22px}
body.touch #toast{top:20%}
body.touch #warn{font-size:16px;top:14%}
body.touch #count{top:36%}
@media (max-height:500px){body.touch .brand h1{font-size:40px}body.touch .col{margin-top:18vh}}
/* ---------- gacha show ---------- */
.pc.back{border-color:var(--line);background:repeating-linear-gradient(45deg,rgba(63,242,255,.07) 0 6px,transparent 6px 12px),rgba(7,11,26,.92)}
.pc.back>*{visibility:hidden}
.pc.back.hint{border-color:var(--rc);box-shadow:0 0 18px var(--rc);animation:hintP .5s ease-in-out infinite alternate}
@keyframes hintP{to{box-shadow:0 0 30px var(--rc),inset 0 0 18px var(--rc)}}
.pc.rev{animation:pcIn .4s ease-out}
.pc.UR.rev{background:linear-gradient(120deg,rgba(255,79,94,.28),rgba(255,201,63,.28),rgba(157,255,79,.22),rgba(63,242,255,.28),rgba(255,79,216,.28),rgba(255,79,94,.28));background-size:400% 400%;animation:pcIn .4s ease-out,urBg 3s linear infinite}
.pc.UR.rev::after{content:"";position:absolute;inset:-3px;pointer-events:none;border:2px solid #fff;box-shadow:0 0 26px #ffc93f,0 0 50px #ff4fd8;animation:urPulse .8s ease-in-out infinite alternate}
@keyframes urBg{to{background-position:400% 0}}
@keyframes urPulse{to{box-shadow:0 0 40px #ffc93f,0 0 80px #3ff2ff}}
#pullTitle{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pullTitle small{display:block;font-family:var(--body);font-size:15px;letter-spacing:.08em;margin-top:4px;color:#fff;text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pullTitle.ur{font-size:clamp(28px,5vw,42px);animation:bump .6s}
#pullOk:disabled{opacity:.35;cursor:default}
#gfx{z-index:60;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 55%,rgba(20,30,70,.94),#02030a 72%);cursor:pointer;--gc:#3ff2ff}
#gfx .rays{position:absolute;left:50%;top:55%;width:220vmax;height:220vmax;background:repeating-conic-gradient(var(--gc) 0 3deg,transparent 3deg 15deg);opacity:.14;-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);transform:translate(-50%,-50%);animation:rays 8s linear infinite}
@keyframes rays{to{transform:translate(-50%,-50%) rotate(360deg)}}
#gfx.sr .rays{opacity:.26;animation-duration:4s}
#gfx.ur .rays{background:repeating-conic-gradient(#ff4f5e 0 3deg,transparent 3deg 8deg,#ffc93f 8deg 11deg,transparent 11deg 16deg,#3ff2ff 16deg 19deg,transparent 19deg 24deg);opacity:.42;animation-duration:2.2s}
.gcube{position:relative;z-index:1;width:130px;height:130px;perspective:700px;opacity:0;transform:translateY(-60vh) scale(.4)}
#gfx.in .gcube{animation:gdrop .7s cubic-bezier(.2,1.4,.4,1) forwards,gshake .09s .8s linear infinite}
#gfx.ur .gcube{animation:gdrop .01s forwards,gshake .045s linear infinite}
#gfx.open .gcube{animation:gopen .35s ease-in forwards}
@keyframes gdrop{to{transform:none;opacity:1}}
@keyframes gshake{0%{translate:0 0}25%{translate:-3px 2px}50%{translate:2px -3px}75%{translate:3px 3px}}
@keyframes gopen{from{transform:none;opacity:1}to{transform:scale(2.8);opacity:0}}
.gc{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:gspin 2.4s linear infinite}
#gfx.sr .gc{animation-duration:1.1s}#gfx.ur .gc{animation-duration:.55s}
@keyframes gspin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.gc i{position:absolute;inset:0;border:3px solid var(--gc);background:rgba(4,8,20,.5);box-shadow:0 0 22px var(--gc),inset 0 0 26px var(--gc)}
.gc i:nth-child(1){transform:translateZ(65px)}.gc i:nth-child(2){transform:rotateY(90deg) translateZ(65px)}.gc i:nth-child(3){transform:rotateY(180deg) translateZ(65px)}
.gc i:nth-child(4){transform:rotateY(-90deg) translateZ(65px)}.gc i:nth-child(5){transform:rotateX(90deg) translateZ(65px)}.gc i:nth-child(6){transform:rotateX(-90deg) translateZ(65px)}
.gflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#gfx.flash .gflash{animation:gfl .5s ease-out}
#gfx.open .gflash{animation:gwhite .45s ease-in forwards}
@keyframes gfl{0%{opacity:.85}100%{opacity:0}}
@keyframes gwhite{to{opacity:1}}
.gtxt{position:absolute;top:16%;left:0;right:0;text-align:center;font-family:var(--disp);font-size:clamp(40px,9vw,96px);color:#fff;text-shadow:0 0 24px var(--gc),0 0 60px var(--gc);white-space:nowrap}
#gfx.flash .gtxt{animation:bump .5s}
.gskip{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--dim);font-size:12px;letter-spacing:.2em;white-space:nowrap}
/* ---------- level / rank / missions ---------- */
.prof{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.lvl{display:flex;flex-direction:column;align-items:center;font-family:var(--num);line-height:1;min-width:48px}
.lvl b{font-size:10px;color:var(--dim);letter-spacing:.2em}
.lvl em{font-style:normal;font-size:28px;font-weight:700;color:var(--cy);text-shadow:0 0 10px var(--cy);font-variant-numeric:tabular-nums}
.xpt{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);white-space:nowrap;gap:8px}
.xpt b{font-family:var(--num);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.bar.xp{height:8px;margin-top:5px}
.prow{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.rkchip{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-size:14px;color:var(--rc);white-space:nowrap;min-width:0}
.rkchip svg{width:24px;height:24px;flex:none;filter:drop-shadow(0 0 6px var(--rc))}
.rkchip small{font-family:var(--num);font-size:11px;color:var(--dim)}
.prow .shopBtn{margin-left:auto;font-size:14px;padding:7px 14px;border-color:var(--cy);color:var(--cy);background:rgba(63,242,255,.08)}
.badge{position:absolute;top:-9px;right:-6px;font-style:normal;font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:0;padding:0 6px;background:var(--bad);color:#fff;box-shadow:0 0 10px var(--bad);animation:fb 1.2s ease-in-out infinite alternate}
.mlist{display:flex;flex-direction:column;gap:8px;max-height:min(62vh,560px);overflow-y:auto;padding-right:4px}
.mi{display:grid;grid-template-columns:1fr auto;gap:5px 14px;align-items:center;padding:9px 11px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.mi .mt{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mi .mt small{font-family:var(--num);font-weight:500;color:var(--dim);margin-left:6px}
.mi .bar{height:6px}
.mi .pr{font-family:var(--num);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.mi .side{grid-column:2;grid-row:1/span 3;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mi .rw{display:flex;align-items:center;gap:6px;font-family:var(--num);font-weight:700;color:var(--gold);white-space:nowrap}
.mi button{font-family:var(--disp);font-size:13px;padding:5px 12px;border:1px solid var(--gold);background:rgba(255,201,63,.14);color:var(--gold);cursor:pointer;white-space:nowrap}
.mi button:disabled{border-color:var(--line);color:var(--dim);background:transparent;cursor:default}
.mi.ready{border-color:var(--gold);box-shadow:inset 0 0 16px rgba(255,201,63,.22)}
.mi.done{opacity:.5}
.prog{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);padding:10px 12px;background:rgba(63,242,255,.04)}
.prog .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;white-space:nowrap}
.prog .row em{font-style:normal;font-family:var(--num);font-variant-numeric:tabular-nums}
.prog .up{font-family:var(--disp);color:var(--gold);letter-spacing:.08em;text-shadow:0 0 12px rgba(255,201,63,.6);animation:bump .6s}
.prog .neg{color:var(--bad)}.prog .pos{color:var(--ok)}
.modal .card{max-height:calc(100vh - 32px);overflow-y:auto}
@media (prefers-reduced-motion:reduce){.pc.rev,.pc.back.hint,#gfx *{animation-duration:.01s!important}}


/* ===== phones (landscape): a layout made for small, wide screens ===== */
body.phone{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
body.phone .panel{padding:10px 12px}
body.phone #menu:not([hidden]),body.phone #shop:not([hidden]){display:block!important}
body.phone #menu,body.phone #shop{padding:0!important;overflow:hidden!important;pointer-events:none!important;background:linear-gradient(90deg,rgba(4,6,13,0) 30%,rgba(4,6,13,.72) 46%)!important}
body.phone #menu .brand{position:absolute;left:calc(14px + var(--sl));top:calc(10px + var(--st));gap:2px;pointer-events:none}
body.phone .brand .en{font-size:8px;letter-spacing:.3em}
body.phone .brand h1{font-size:28px!important}
body.phone .brand p{display:none!important}
body.phone #menu .col,body.phone #shop .col{position:absolute;top:calc(8px + var(--st));right:calc(8px + var(--sr));bottom:calc(8px + var(--sb));width:min(55%,470px);max-height:none!important;margin:0!important;padding:0 4px 10px 0!important;overflow-y:auto!important;gap:8px;pointer-events:auto}
body.phone #menu .col{bottom:calc(62px + var(--sb))}
body.phone .col{overflow-x:hidden!important}body.phone .col>*{min-width:0;max-width:100%;box-sizing:border-box}body.phone .col .seg,body.phone .col .row3>div{min-width:0}
body.phone #fsTip{top:auto;bottom:calc(56px + var(--sb));left:calc(10px + var(--sl));transform:none;font-size:11px}
body.phone #menu .col>section{order:5}
body.phone #menu .col>section:has(#stages){order:1}
body.phone #menu .col>.prof{order:2}
body.phone #menu .col>.wallet{order:3}

body.phone #menu .col>.langbar{order:6}
body.phone #menu .col>section:has(#keys){order:7}
body.phone .stages{gap:6px}
body.phone .stage b{font-size:13px}body.phone .stage span{font-size:9px}
body.phone .row3{grid-template-columns:1fr}
body.phone h2{font-size:15px}
body.phone #startBtn{position:fixed;right:calc(8px + var(--sr));bottom:calc(8px + var(--sb));width:min(29%,230px);height:46px;padding:0;font-size:20px;letter-spacing:.3em;z-index:5;pointer-events:auto}
body.phone #onlineBtn{position:fixed;right:calc(16px + var(--sr) + min(29%,230px));bottom:calc(8px + var(--sb));width:min(25%,200px);height:46px;padding:0;font-size:13px;letter-spacing:.12em;z-index:5;pointer-events:auto}
#pbar{display:none}
body.phone #pbar{display:flex;position:fixed;left:calc(10px + var(--sl));bottom:calc(8px + var(--sb));gap:6px;z-index:5;pointer-events:auto}
#pbar button{position:relative;font-family:var(--disp);font-size:12px;letter-spacing:.06em;padding:0 12px;height:40px;border:1px solid var(--line);background:rgba(7,11,26,.85);color:var(--ink);cursor:pointer;white-space:nowrap}
#pbar .pShop{border-color:var(--gold);color:var(--gold)}
#pbar em{position:absolute;top:-8px;right:-6px;font-style:normal;font-size:9px;background:var(--bad);color:#fff;padding:1px 5px;border-radius:8px}
#pbar .pFs{border-color:var(--cy);color:var(--cy)}
body.phone #shop .shopL{position:absolute;left:calc(10px + var(--sl));top:calc(8px + var(--st));bottom:calc(8px + var(--sb));width:40%;pointer-events:none;justify-content:space-between}
body.phone #shop .shopL>*{pointer-events:auto}
body.phone .backBtn{padding:6px 12px;font-size:12px}
body.phone .skinInfo{padding:8px 10px;gap:3px;width:100%}
body.phone .skinInfo h2{font-size:18px}
body.phone .skinInfo .btn{padding:8px;font-size:12px}
body.phone .tabs{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
body.phone .tabs button{font-size:11px;padding:7px 2px;letter-spacing:.02em}
body.phone .coinbar{padding-block:6px}body.phone .coinbar b{font-size:18px}
body.phone .modal{padding:6px}
body.phone .modal .card{max-height:calc(100vh - 12px);max-height:calc(100dvh - 12px);padding:12px 14px;gap:8px}
body.phone .modal .card h2{font-size:20px}
body.phone #sndHint{left:calc(14px + var(--sl));bottom:auto;top:calc(52px + var(--st));transform:none;font-size:11px;padding:4px 10px}
body.phone .tl{left:calc(10px + var(--sl))!important}
body.phone .bl{left:calc(10px + var(--sl))!important}
body.phone .tr{right:calc(10px + var(--sr))!important}
/* how to play full screen */
#fsHelp .steps{display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.5}
#fsHelp .steps b{color:var(--cy);font-family:var(--disp);font-weight:400;margin-right:6px}
#fsTip{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:8px;font-size:12px;background:rgba(7,11,26,.94);border:1px solid var(--cy);padding:6px 8px 6px 12px;box-shadow:0 0 14px rgba(63,242,255,.35);white-space:nowrap}
#fsTip button{font-size:11px;padding:4px 10px;border:1px solid var(--cy);background:transparent;color:var(--cy);cursor:pointer}
#fsTip .x{border-color:var(--line);color:var(--dim)}

<body>


<div id="rotate"><div class="ph"></div><b data-i="rotTitle"></b><small data-i="rotSub"></small></div>
<canvas id="game"></canvas>

<div id="menu" class="ov">
  <div class="brand">
    <div class="en">DRAGONFLY WARS · CUBE AIRSPACE</div>
    <h1 data-i="title">トンボ大戦</h1>
    <p data-i="intro"></p>
  </div>
  <div class="col">
    <section class="panel langbar">
      <div class="lbl"><span data-i="language">言語</span></div>
      <div class="seg small four" id="langSeg"></div>
    </section>
    <section class="panel prof" id="profPanel">
      <div class="lvl"><b>Lv</b><em id="lvNum">1</em></div>
      <div><div class="xpt"><span data-i="xp"></span><b id="xpTxt">0 / 100</b></div><div class="bar xp"><i id="xpBar" style="--c:var(--cy)"></i></div></div>
      <div class="prow"><div class="rkchip" id="rankChip"></div><button class="shopBtn" id="msnBtn"><span data-i="missions"></span><em class="badge" id="msnBadge" hidden></em></button></div>
    </section>
    <section class="panel wallet">
      <div class="wl"><span class="cn"></span><b id="menuCoins">0</b></div>
      <div class="ws"><small data-i="skinLabel"></small><b id="menuSkin"></b></div>
      <button class="shopBtn" id="shopBtn"><span data-i="shop"></span><em id="freeBadge" hidden></em></button>
    </section>
    <section class="panel">
      <h2><span data-i="hangar"></span> <small>HANGAR</small></h2>

      <div class="lbl"><span data-i="paint"></span></div>
      <div class="swatches" id="swatches"></div>

      <div class="lbl"><span data-i="wing"></span></div>
      <div class="seg" id="wingSeg"></div>

      <div class="lbl" style="margin-top:12px"><span data-i="diff"></span></div>
      <div class="seg small four" id="diffSeg"></div>

  </div>
  <div id="pbar"><button class="pShop" id="pShop"><span data-i="shop"></span><em id="pFree" hidden></em></button><button id="pMsn"><span data-i="missions"></span><em id="pMsnB" hidden></em></button><button class="pFs" id="pFs"></button></div>
</div>

<div id="hud" class="ov" hidden>
  <div id="water"></div>
  <div id="speed"></div>
  <div id="markers"></div>
  <div id="warn" hidden></div>
  <div id="cross"></div>
  <div class="tl" id="board"></div>

// shared body plan for the flying animals: stretched-out "superhero" pose, head forward (-z)
function flyingAnimal(K,A){

  const head=K.grp(0,.25,-1.15);const hs=A.hs??1.05;
  K.add(fur,hs,hs*.9,hs*.9,0,0,0,head);
  K.add(fur2,hs*.55,hs*.4,hs*.35,0,-hs*.18,-hs*.5,head);                                  // muzzle
  K.add(nose,.16,.12,.08,0,-hs*.05,-hs*.68,head);
  for(const s of[-1,1]){K.add(eyeW,.2,.22,.06,s*hs*.24,hs*.12,-hs*.46,head);K.add(eye,.11,.14,.06,s*hs*.24,hs*.1,-hs*.49,head)}

  if(A.extraHead)A.extraHead(K,head,hs,fur,fur2,acc);
  // legs: front paws reach forward, hind legs trail back
  for(const s of[-1,1]){
    K.add(A.legMat==='acc'?acc:fur,.3,.3,.9,s*bw*.32,-.15,-1.1,K.g,-.25);K.add(fur2,.32,.32,.25,s*bw*.32,-.05,-1.55,K.g,-.25);
    K.add(A.legMat==='acc'?acc:fur,.34,.34,1,s*bw*.3,-.2,1.6,K.g,.3);K.add(fur2,.36,.3,.3,s*bw*.3,-.05,2.15,K.g,.3);

}

  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,tt);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),tt+dur);

}

let matchMin=3,matchSeed=1;
function startMatch(opt){
  if(TOUCH&&canFS())enterFullscreen(true);
  clearHolders();
  store.set('tombo-live',1); // cleared when the match ends normally; still set after a crash
  if(!opt||opt instanceof Event)opt={};
  audioInit();saveCfg();
  online=!!opt.online;matchMin=opt.time||cfg.time;teamMode=(opt.mode||(online?'ffa':cfg.mode))==='team';matchSeed=opt.seed||((Math.random()*1e9)|0);
  let sid=opt.stage||cfg.stage;if(sid==='random'){const pool=STAGES.filter(x=>!x.hide);sid=pool[Math.floor(Math.random()*pool.length)].id}
  stage=STAGES.find(s=>s.id===sid&&!s.hide)||STAGES[0];
  if(typeof Net!=='undefined')Net.resetMatch();
  for(const d of drones){scene.remove(d.mesh);disposeTree(d.mesh)}
  for(const b of tbombs){worldGroup.remove(b.g)}
  relicReset();
  missiles=[];blasts=[];bolts=[];tbombs=[];hitStop=0;slowT=0;fireT=0;$('#warn').hidden=true;
  mkPool.clear();markersEl.innerHTML='';dmgEls.length=0;
  clearWorld();resetGrid();fields=[];beams=[];items=[];pairCd.clear();playerSees.clear();
  R=mulberry32(stage.seed);
  batch={solid:[],glow:[],rot:[]};
  buildEnv(stage);
  if(bloom){bloom.strength=stage.bloom[0];bloom.threshold=stage.bloom[1]}
  ({res:genRes,for:genFor,riv:genRiv,wat:genWater,pyr:genPyr,lav:genLava,rok:genRock,vol:genVolc,twr:genTower})[stage.type](stage);
  flushBatch();flushSlants();
  genSpawnPts();
  R=Math.random;
  buildWorldMap(stage);
  beacon=makeBeacon();
  drones=[];
  player=makeDrone({...cfg,skin:equipped()},(cfg.name||'YOU').slice(0,10),true);drones.push(player);
  const cols=COLORS.filter(c=>c!==cfg.color);
  const names=[...L.bots].sort(()=>Math.random()-.5);
  for(let i=0;i<(online?0:cfg.bots);i++){
    const bc={color:cols[i%cols.length],body:pick(['slim','std','heavy']),wing:pick(['long','twin','blade']),bias:ri(15,85),skin:Math.random()<.4?pick(SKIN_IDS.filter(x=>x!=='default')):'default'};
    const bot=makeDrone(bc,names[i%names.length],false);const sk=D().skill;bot.ai.skill=sk[0]+(sk[1]-sk[0])*Math.random();drones.push(bot);
    if(teamMode)setTeam(bot,i%2?0:1);
  }
  if(teamMode)setTeam(player,0);
  for(const d of drones)respawn(d);
  for(let i=0;i<9;i++)items.push(makeItemSpot(online?mulberry32(matchSeed+i*7919):null));
  timeLeft=(opt.left||matchMin*60);now=0;respawnedAt=-9;uwState=false;$('#water').style.opacity=0;
  camPos.copy(player.pos).add(new V3(0,6,14));camera.position.copy(camPos);
  $('#stageName').textContent=stageName(stage.id)+(teamMode?' · '+t('modeTeam'):'')+(online?' · ONLINE':' · CPU '+L.diffN[cfg.diff]);$('#feed').innerHTML='';$('#log').innerHTML='';
  $('#menu').hidden=true;$('#shop').hidden=true;$('#result').hidden=true;$('#pause').hidden=true;$('#hud').hidden=false;
  state='count';countT=opt.late?0:3;lastCount=0;lastEndCount=0;$('#count').hidden=true;$('#online').hidden=true;
  MenuBGM.stop(.5);BGM.start();msnAtStart=claimable();
  toast(stageName(stage.id),teamMode?t('modeTeam')+' · '+t('modeTeamSub'):t('stageSub',{m:matchMin}),stage.accent);
  if(TOUCH){noLock=true;touch.dash=touch.stop=false;touch.stick=null;$('#tStick').hidden=true;$('#tHint').hidden=false}
  else if(!noLock)requestLock();
}
let pausedFrom='play',finishT=0,lastEndCount=0;

  pausedFrom=state;state='pause';$('#pause').hidden=false;if(buzzGain)buzzGain.gain.value=0;BGM.pause()}

function endMatch(){
  store.set('tombo-live',0);
  state='result';if(document.pointerLockElement)document.exitPointerLock();if(buzzGain)buzzGain.gain.value=0;BGM.stop();
  const sorted=pilots().sort((a,b)=>b.kills-a.kills||a.deaths-b.deaths);
  let place=sorted.indexOf(player)+1,teamRes=null;
  if(teamMode){const a=teamScore(0),b=teamScore(1),mine=teamIdx(player),win=a===b?-1:a>b?0:1;teamRes={a,b,win,mine};
    sorted.sort((x,y)=>(teamIdx(x)===win?0:1)-(teamIdx(y)===win?0:1)||y.kills-x.kills||x.deaths-y.deaths);
    place=win<0?2:win===mine?1:sorted.length}
  $('#resTitle').textContent=teamRes?(teamRes.win<0?t('teamDraw'):t('teamWin',{t:teamName(teamRes.win)})):place===1?t('victory'):t('place',{n:place});
  $('#resTitle').style.color=teamRes&&teamRes.win>=0?hex(TEAM_COL[teamRes.win]):'';
  const rk=$('#rank');rk.innerHTML='';

  if(teamRes){const h=document.createElement('div');h.className='tres';for(const i of[0,1]){const b=document.createElement('b');b.style.setProperty('--c',hex(TEAM_COL[i]));b.textContent=teamName(i)+'  '+(i?teamRes.b:teamRes.a);h.append(b);if(!i){const v=document.createElement('span');v.textContent='VS';h.append(v)}}rk.append(h)}
  sorted.forEach((o,i)=>{
    const a=document.createElement('span');a.className='p'+(o.isPlayer?' me':'');a.textContent=teamRes?(teamIdx(o)===teamRes.win?'WIN':teamRes.win<0?'DRAW':'—'):i+1;
    const c=document.createElement('i');c.style.setProperty('--c',hex(pcol(o)));
    const n=document.createElement('span');n.textContent=o.name+'  '+L.bodyN[o.cfg.body][0]+' / '+L.wingN[o.cfg.wing][0];if(o.isPlayer)n.className='me';

    const k=document.createElement('em');k.textContent=o.kills;const dd=document.createElement('em');dd.textContent=o.deaths;
    rk.append(a,c,n,k,dd);
  });
  // coin reward
  const base=15,kc=player.kills*10,pb=[40,25,10][place-1]||0;
  const mult=(online?1.3:{easy:.6,normal:1,hard:1.4,oni:1.9}[cfg.diff])*Math.pow(matchMin/3,.8);
  const total=Math.max(1,Math.round((base+kc+pb)*mult));
  save.coins+=total;saveSave();
  const rw=$('#reward');rw.innerHTML='';
  const h=document.createElement('h3');h.textContent=t('rewardTitle');rw.append(h);
  const line=(a,b,cls)=>{const d=document.createElement('div');if(cls)d.className=cls;const sp=document.createElement('span');sp.textContent=a;const em=document.createElement('em');em.textContent=b;d.append(sp,em);rw.append(d)};
  renderProg(applyProgress(place,sorted.length,player.kills,sorted));
  line(t('rBase'),'+'+base);line(t('rwKills',{n:player.kills}),'+'+kc);if(pb)line(t('rPlace'),'+'+pb);line(t('rMult'),'×'+mult.toFixed(2));line(t('total'),'+'+total,'tot');
  $('#againBtn').textContent=online?t('onLobby'):t('again');
  if(online)Net.leaveMatch(true);
  $('#result').hidden=false;
  setTimeout(()=>{if(state==='result')MenuBGM.start()},1800); // after the result fanfare
}

function applyProgress(place,n,kills,sorted){
  const st=save.st;st.matches++;
  if(n>=2&&place<=Math.min(3,n-1))st.wins++;
  if(place===1){st.firsts++;if(!online)st.firstBy[cfg.diff]=(st.firstBy[cfg.diff]||0)+1}
  const dm=online?1.2:({easy:.7,normal:1,hard:1.25,oni:1.5}[cfg.diff]||1);
  const xp=Math.round((40+kills*15+([60,35,15][place-1]||0))*dm*Math.pow(matchMin/3,.7));
  const lv0=levelInfo(save.xp).lv;save.xp+=xp;const lv1=levelInfo(save.xp).lv;
  // rating (online only): Elo against every other pilot in the match, split across the field
  let drp=0;const r0=rankIdx(save.rate);
  if(online&&sorted&&n>=2){
    const me=sorted.find(o=>o.isPlayer),K=40/(n-1);let sum=0;
    for(const o of sorted){if(o===me)continue;const rb=o.rate||1000,E=1/(1+Math.pow(10,(rb-save.rate)/400));
      if(teamMode&&!foe(me,o))continue;
      const S=teamMode?(teamScore(teamIdx(me))===teamScore(teamIdx(o))?.5:teamScore(teamIdx(me))>teamScore(teamIdx(o))?1:0):o.kills===me.kills&&o.deaths===me.deaths?.5:(sorted.indexOf(me)<sorted.indexOf(o)?1:0);sum+=S-E}
    if(teamMode){const opp=sorted.filter(o=>foe(me,o)).length;sum*=(n-1)/Math.max(1,opp)}
    drp=Math.round(sum*K);save.rate=Math.max(0,save.rate+drp);

/* ================= battle music: the user's own songs (instrumental mixes) ================= */
const BGM=(()=>{
  // intro plays once, then [loopStart, loopEnd) repeats; loop points sit on bar lines where the music matches
  const SONGS=[{url:'rhythm_prism.mp3',gain:1,loopStart:2.666667,loopEnd:88}]; // add more remixed songs here
  const LEVEL={off:0,low:.12,mid:.2,high:.32};
  const bufs=new Map();let out=null,src=null,cur=null,last=-1,t0=0,off=0,playing=false,fading=false;
  const target=()=>muted?0:(LEVEL[cfg.bgm]??LEVEL.mid);
  function load(i){
    if(!bufs.has(i))bufs.set(i,fetch(SONGS[i].url).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(a=>new Promise((res,rej)=>AC.decodeAudioData(a,res,rej))).catch(()=>null));
    return bufs.get(i);
  }
  const wrap=(t,S)=>t<S.loopEnd?t:S.loopStart+(t-S.loopStart)%(S.loopEnd-S.loopStart);
  function play(buf,at){
    const S=SONGS[cur];at=wrap(at,S);
    stopSrc();const s=AC.createBufferSource();s.buffer=buf;s.loop=true;s.loopStart=S.loopStart;s.loopEnd=Math.min(S.loopEnd,buf.duration);
    const g=AC.createGain();g.gain.value=SONGS[cur].gain;s.connect(g);g.connect(out);
    s.start(AC.currentTime+.03,at);t0=AC.currentTime+.03-at;src=s;
  }
  function stopSrc(){if(src){try{src.stop()}catch(e){}src.disconnect();src=null}}
  return{
    start(){if(!AC)return;fading=false;
      if(!out){out=AC.createGain();out.gain.value=0;out.connect(AC.destination)}
      let i=Math.floor(Math.random()*SONGS.length);if(SONGS.length>1&&i===last)i=(i+1)%SONGS.length;last=cur=i;playing=true;
      const now0=AC.currentTime;out.gain.cancelScheduledValues(now0);out.gain.setValueAtTime(0,now0);out.gain.linearRampToValueAtTime(target(),now0+.6);
      load(i).then(b=>{if(b&&playing&&cur===i&&!src)play(b,0)});
    },
    fadeOut(sec){if(!out||!AC)return;const n=AC.currentTime;out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);
      out.gain.setTargetAtTime(0,n,sec/4.5);fading=true;setTimeout(()=>{if(fading){playing=false;stopSrc()}},sec*1000+300)},
    stop(){playing=false;fading=false;if(out){const n=AC.currentTime;out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.linearRampToValueAtTime(0,n+.6)}setTimeout(()=>{if(!playing)stopSrc()},650)},
    pause(){if(src){off=wrap(AC.currentTime-t0,SONGS[cur]);stopSrc()}if(out)out.gain.setTargetAtTime(0,AC.currentTime,.05)},
    resume(){if(!playing)return;load(cur).then(b=>{if(b&&playing&&!src)play(b,off)});this.vol()},
    vol(){if(out&&AC&&!fading)out.gain.setTargetAtTime(playing?target():0,AC.currentTime,.1)}
  };
})();

/* ================= menu music: a calm lounge-jazz loop for the home, shop / gacha and result screens ================= */
const MenuBGM=(()=>{
  const URL='lounge_jazz.mp3',PAD=4*60/84,LEN=16*4*60/84; // one bar of pre/post-roll around a 16-bar loop
  let buf=null,src=null,out=null,loading=null,on=false;
  const level=()=>muted?0:(({off:0,low:.12,mid:.2,high:.32})[cfg.bgm]??.2)*1.15;
  function load(){if(!loading)loading=fetch(URL).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(a=>new Promise((res,rej)=>AC.decodeAudioData(a,res,rej))).then(b=>{buf=b;return b}).catch(()=>null);return loading}
  return{
    start(){if(!AC)return;on=true;
      if(!out){out=AC.createGain();out.gain.value=0;out.connect(AC.destination)}
      const n=AC.currentTime;out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.linearRampToValueAtTime(level(),n+1.5);
      load().then(b=>{if(!b||!on||src)return;const s=AC.createBufferSource();s.buffer=b;s.loop=true;s.loopStart=PAD;s.loopEnd=Math.min(PAD+LEN,b.duration);s.connect(out);s.start(AC.currentTime+.05,PAD);src=s})},
    stop(fade=.7){on=false;if(!out||!AC)return;const n=AC.currentTime;out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.linearRampToValueAtTime(0,n+fade);
      setTimeout(()=>{if(!on&&src){try{src.stop()}catch(e){}src.disconnect();src=null}},fade*1000+120)},
    vol(){if(out&&AC&&on)out.gain.setTargetAtTime(level(),AC.currentTime,.1)},
    get playing(){return on}
  };
})();
// browsers only allow sound after the first tap or key press
const calmScreens=()=>state==='menu'||state==='shop'||state==='result';
// iPhone/iPad only unlock audio on a finished tap (touchend/click), not when the finger first touches, so listen to all of them

/* ---------- full screen on phones ---------- */
const IOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const canFS=()=>{const el=document.documentElement;return !!(el.requestFullscreen||el.webkitRequestFullscreen)&&!/iPhone|iPod/.test(navigator.userAgent)}; // iPhone Safari has no page full screen
function enterFullscreen(quiet){
  if(fsEl()||isStandalone())return;
  const el=document.documentElement;
  if(canFS()){try{const r=(el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):el.webkitRequestFullscreen());
    Promise.resolve(r).then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{if(!quiet)showFsHelp()})}catch(e){if(!quiet)showFsHelp()}}
  else if(!quiet)showFsHelp();
}
function showFsHelp(){const st=$('#fsSteps');st.innerHTML='';for(const[n,tx]of(IOS?L.fsIos:L.fsAnd)||[]){const d=document.createElement('div');const b=document.createElement('b');b.textContent=n;d.append(b,tx);st.append(d)}$('#fsHelp').hidden=false}
$('#fsClose').onclick=()=>{$('#fsHelp').hidden=true};
function updateFsUi(){const b=$('#pFs');if(!b)return;const on=!!fsEl()||isStandalone();b.hidden=on||!TOUCH;b.textContent=t('fsBtn')}
$('#pFs').onclick=()=>{audioInit();enterFullscreen(false)};
$('#pShop').onclick=()=>{audioInit();openShop('gacha')};
$('#pMsn').onclick=()=>{audioInit();openMissions()};
for(const ev of['fullscreenchange','webkitfullscreenchange'])document.addEventListener(ev,()=>{updateFsUi();setTimeout(resize,120)});
updateFsUi();
// one-time tip on iPhone: the only way to hide the browser bars is "Add to Home Screen"
if(TOUCH&&IOS&&!isStandalone()&&!store.get('tombo-fstip',0)){const tip=document.createElement('div');tip.id='fsTip';
  const tx=document.createElement('span');tx.textContent='⛶ '+t('fsTip');const how=document.createElement('button');how.textContent=t('fsHow');const x=document.createElement('button');x.className='x';x.textContent='×';
  const close=()=>{tip.remove();store.set('tombo-fstip',1)};how.onclick=()=>{showFsHelp();close()};x.onclick=close;tip.append(tx,how,x);document.body.appendChild(tip);setTimeout(()=>{if(tip.isConnected&&state!=='menu')tip.remove()},30000)}

let triedLock=false;
function lockLandscape(){if(triedLock||!TOUCH)return;triedLock=true;if(canFS())enterFullscreen(true)}
function unlockAudio(e){if(e&&(e.type==='click'||e.type==='touchend'))lockLandscape();audioInit();if(AC&&AC.state!=='running'){try{AC.resume()}catch(e){}}if(calmScreens()&&!MenuBGM.playing)MenuBGM.start();soundHint()}
for(const ev of['pointerdown','pointerup','touchend','click','keydown'])addEventListener(ev,unlockAudio,true);
// small "tap for sound" note on the menu until the browser lets sound play
addEventListener('resize',()=>{if(TOUCH&&innerHeight>innerWidth&&state==='play'&&!online&&typeof pauseGame==='function')pauseGame()});
function soundHint(){{const tp=document.getElementById('fsTip');if(tp)tp.hidden=state!=='menu'}const h=document.getElementById('sndHint');if(!h)return;const tx='🔊 '+t('sndHint');if(h.textContent!==tx)h.textContent=tx;h.hidden=!(calmScreens()&&cfg.bgm!=='off'&&!muted&&!(AC&&AC.state==='running'))}
{const h=document.createElement('div');h.id='sndHint';h.textContent='🔊 '+t('sndHint');document.body.appendChild(h);soundHint();setInterval(soundHint,600)}

/* ================= main loop ================= */
let last=performance.now();
function frame(tms){
  requestAnimationFrame(frame);
  const raw=(tms-last)/1000;let dt=Math.min(.05,raw);last=tms;
  if(cfg.quality==='high'&&(state==='play')){perfLow=raw>1/28?perfLow+raw:Math.max(0,perfLow-raw*.5);if(perfLow>3){perfLow=0;dropQuality(t('autoLow'))}}
  if(state==='menu'||state==='shop'){
    const ht=tms/1000;
    if(preview){preview.rotation.y=ht*.5;preview.position.y=3.2+Math.sin(ht*1.6)*.25;preview.userData.fl=(preview.userData.fl||0)+dt*38;
      animModel(preview.userData,preview.userData.fl,dt,false)}
    for(const m of hangarFloat){m.position.y=m.userData.by+Math.sin(ht*m.userData.sp+m.userData.ph)*.8;m.rotation.x+=dt*.3;m.rotation.y+=dt*.4}
    render(hangar,hcam);return;
  }
  if(state==='count'){
    if(online)Net.tick(dt);
    countT-=dt;const n=Math.ceil(countT);
    if(n>0&&n!==lastCount){lastCount=n;showCount(String(n),false);tone(660,660,.16,'square',.12)}
    for(const d of drones)droneStep(d,dt);
    if(countT<=0){state='play';for(const d of drones)d.invuln=3;showCount(t('go'),true);tone(1320,1320,.4,'square',.14);setTimeout(()=>{if(state!=='count')$('#count').hidden=true},850)}
  }
  const stopped=state==='play'&&hitStop>0;
  if(stopped)hitStop-=dt;
  if(state==='play'&&!stopped){
    const rdt=dt;{const k=slowT>0?.22+.78*(1-slowT/SLOW_LEN):1;slowT=Math.max(0,slowT-dt);dt*=k} // slow-motion recovery after a hit-stop
    now+=dt;timeLeft-=rdt;
    playerControl(dt);
    for(const d of drones)if(!d.isPlayer&&!d.remote)botControl(d,dt);
    for(const d of [...drones]){try{droneStep(d,dt)}catch(err){console.error(err);d.beam=d.mega=d.bolt=d.turn=null}}
    droneCollisions();
    updateItems(dt);updateFields(dt);updateMissiles(dt);updateBombs(dt);updateBolts(dt);updateTimeBombs(dt);updateFire(dt);updateHazards(dt);updateRelics(dt);
    if(online)Net.tick(dt);
    losT-=dt;if(losT<=0){losT=.1;for(const o of drones)if(o!==player)playerSees.set(o,o.alive&&player.alive&&!hidden(o)&&o.pos.distanceToSquared(player.pos)<160*160&&hasLOS(player.pos,o.pos))}
    if(buzzGain&&!muted){buzzGain.gain.value=player.alive?.025+player.vel.length()*.0007:0;buzz.frequency.value=(90+player.vel.length()*2.2)*(submerged(player.pos)?.5:1)}
    else if(buzzGain)buzzGain.gain.value=0;
    // last 5 seconds: big countdown, music fades out so it lands exactly on the whistle
    const n=Math.ceil(timeLeft);
    if(timeLeft<=5&&timeLeft>0&&n!==lastEndCount){lastEndCount=n;showCount(String(n),false);tone(n===1?880:660,n===1?880:660,.16,'square',.12);if(n===5)BGM.fadeOut(5)}
    if(timeLeft<=0){state='finish';finishT=2.4;showCount(t('finish'),true);sfx.finish();if(buzzGain)buzzGain.gain.value=0;if(document.pointerLockElement)document.exitPointerLock()}
  }
  if(state==='finish'){ // slow-motion moment before the results
    if(online)Net.tick(dt);
    finishT-=dt;const sd=dt*.25;now+=sd;
    for(const d of [...drones])droneStep(d,sd);
    updateMissiles(sd);updateBombs(sd);updateBolts(sd);updateTimeBombs(sd);updateHazards(sd);
    if(finishT<=0){$('#count').hidden=true;endMatch()}
  }
  if(player){
    const pdt=stopped?dt*.08:dt; // sparks hang in the air during the hit-stop
    updateBeams(pdt);updateParticles(pdt);updateAmbient(pdt);
    updateCamera(state==='play'||state==='count'||state==='finish'?dt:0);
    if(state==='play'||state==='count'||state==='finish'){updateHUD(dt);updateMarkers();updateDmg(dt);drawMini()}
  }
  render(scene,camera);
}
function render(sc,cam){
  if(composer&&cfg.quality==='high'){renderPass.scene=sc;renderPass.camera=cam;composer.render()}
  else renderer.render(sc,cam);
}

if(store.get('tombo-live',0)){ // the page was reloaded in the middle of a match: switch to Light graphics so it does not happen again
  store.set('tombo-live',0);if(cfg.quality!=='low'){cfg.quality='low';saveCfg();setTimeout(()=>{try{toast(t('crashLow'),'',0xffb53f)}catch(e){}},900)}}
applyLang();rebuildPreview();resize();
requestAnimationFrame(frame);
})();
